# FleetRanger production stack. Install-specific values come from a .env
# file next to this one; see .env.example.
#
# TLS is terminated by a reverse proxy on the host. The backend listens on
# localhost only, and PostgreSQL is reachable only on the internal network.

name: fleetranger

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetranger
      POSTGRES_DB: fleetranger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${FLEETRANGER_DATA_DIR:?}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fleetranger", "-d", "fleetranger"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: fleetranger-backend:${FLEETRANGER_VERSION:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fleetranger:${POSTGRES_PASSWORD}@postgres/fleetranger
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - 127.0.0.1:8080:8080
