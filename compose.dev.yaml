# Local development services. The backend runs natively (see README).

name: fleetranger-dev

services:
  postgres:
    # Same image as deploy/compose.yaml.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: fleetranger
      POSTGRES_PASSWORD: fleetranger
      POSTGRES_DB: fleetranger
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432

  # SvelteKit dev server with hot reload. Host networking lets it reach the
  # natively running backend on 127.0.0.1:8080 and serve on 127.0.0.1:5173.
  web:
    build:
      context: web
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      VITE_POLL: ${VITE_POLL:-}
      # The install's public Mapbox token (pk.…), for maps.
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 127.0.0.1"
    volumes:
      - ./web:/repo/web
      # Kept out of the shared folder: faster, and no host-specific binaries in the repo.
      - web-node-modules:/repo/web/node_modules

  # S3 for raw logs, to try FLEETRANGER_S3_BUCKET (see README). Development only.
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    volumes:
      - ./garage.dev.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    ports:
      - 127.0.0.1:3900:3900

volumes:
  postgres:
  web-node-modules:
  garage:
