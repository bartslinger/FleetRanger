# nginx in front of FleetRanger, as it runs on our own server. Replace
# fleet.example.org with your domain and point the certificate paths at your
# certificate (e.g. from certbot). See the self-hosting docs, "Install".
#
server {
    listen 80;
    listen [::]:80;
    server_name fleet.example.org;

    return 301 https://$host$request_uri;
}

# Anyone may register an app for OAuth: a few registrations a minute per
# address are plenty for a real assistant.
limit_req_zone $binary_remote_addr zone=oauth_register:1m rate=10r/m;

# A controller pairs by sending a code someone created in the web app; the
# codes are short, so guessing is limited per address the same way.
limit_req_zone $binary_remote_addr zone=pairing:1m rate=10r/m;

# FleetRanger: the backend (127.0.0.1:8080) takes the API, the login round
# trip, MCP and OAuth's metadata, the web app (127.0.0.1:3000) everything else.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Off until Ubuntu's nginx has the fixes for CVE-2026-123633 and
    # CVE-2026-123007 (HTTP/2, remote code execution); then back on.
    http2 off;
    server_name fleet.example.org;

    ssl_certificate /etc/letsencrypt/live/fleet.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.example.org/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The web app serves its scripts and styles compressed already, and
    # Ubuntu's nginx.conf has gzip on for HTML; this adds JSON: the API's and
    # the web app's page data, such as the session cards' tracks. Event
    # streams aren't JSON, so no event waits for compression.
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # Flight logs uploaded by controllers, as the backend accepts them
        # (at most 64 MB).
        client_max_body_size 64m;
    }

    # Server-sent events: passed on as they come, and kept open.
    location = /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Too many attempts get 429, which the controller app explains: the
    # address of android-v0.3.0 and that of the versioned controller API.
    location ~ ^/api/controller(/v1)?/pairing$ {
        limit_req zone=pairing burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /auth/oauth/register {
        limit_req zone=oauth_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # AI assistants (MCP), and where they learn how to get a token.
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
    }

    location /.well-known/oauth- {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
