# Local development services. The backend runs natively (see README).

name: fleetranger-dev

services:
  postgres:
    # Same image as deploy/compose.yaml.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: fleetranger
      POSTGRES_PASSWORD: fleetranger
      POSTGRES_DB: fleetranger
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432

volumes:
  postgres:
