<!doctype html>
<html lang="en" class="theme-white">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The page's only script. The theme switch applies the visitor's choice
		     before the page is drawn, and remembers a new one in this browser;
		     without a choice the system setting applies. Steps that scroll past a
		     picture show theirs when they reach it. -->
		<script>
			(function () {
				var root = document.documentElement;
				try {
					var theme = localStorage.getItem('theme');
					if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
				} catch (e) {}
				root.classList.add('js');
				document.addEventListener('click', function (event) {
					var button = event.target.closest('[data-set-theme]');
					if (!button) return;
					root.dataset.theme = button.dataset.setTheme;
					try {
						localStorage.setItem('theme', root.dataset.theme);
					} catch (e) {}
				});
				// The current step is the last one whose top has passed 40% of the
				// window when the picture is beside the steps, a little above the
				// picture's middle, or the picture's bottom when it is above them (on
				// phones).
				var pending = false;
				function showSteps() {
					pending = false;
					document.querySelectorAll('[data-steps]').forEach(function (group) {
						var picture = group.querySelector('[data-picture]').getBoundingClientRect();
						var beside = picture.left > group.getBoundingClientRect().left;
						var line = beside ? innerHeight * 0.4 : picture.bottom;
						var current = '0';
						group.querySelectorAll('[data-step]').forEach(function (step) {
							if (step.getBoundingClientRect().top < line) current = step.dataset.step;
						});
						group.querySelectorAll('[data-shown]').forEach(function (shown) {
							shown.classList.toggle('active', shown.dataset.shown === current);
						});
					});
				}
				addEventListener(
					'scroll',
					function () {
						if (!pending) requestAnimationFrame(showSteps);
						pending = true;
					},
					{ passive: true }
				);
				document.addEventListener('DOMContentLoaded', showSteps);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
