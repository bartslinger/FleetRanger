[package]
name = "fleetranger"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
# Same date/time library as dji-log-parser.
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
cookie = { version = "0.18.2", default-features = false }
dji-log-parser = { path = "vendor/dji-log-parser" }
openidconnect = { version = "4.0.1", default-features = false, features = ["ureq"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json", "ipnet"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 2.x rather than 3.x: dji-log-parser already depends on it.
ureq = "2.12.1"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
