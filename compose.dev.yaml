# Local development services. The backend runs natively (see README).

name: fleetranger-dev

services:
  postgres:
    # Same image as deploy/compose.yaml.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: fleetranger
      POSTGRES_PASSWORD: fleetranger
      POSTGRES_DB: fleetranger
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432

  # SvelteKit dev server with hot reload. Host networking lets it reach the
  # natively running backend on 127.0.0.1:8080 and serve on 127.0.0.1:5173.
  web:
    build:
      context: web
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      VITE_POLL: ${VITE_POLL:-}
      # The organisation's time zone, e.g. Europe/Amsterdam.
      TIME_ZONE: ${TIME_ZONE:-UTC}
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 127.0.0.1"
    volumes:
      - ./web:/repo/web
      # Kept out of the shared folder: faster, and no host-specific binaries in the repo.
      - web-node-modules:/repo/web/node_modules

volumes:
  postgres:
  web-node-modules:
