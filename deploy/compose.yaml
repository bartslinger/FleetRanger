# FleetRanger production stack. Install-specific values come from a .env
# file next to this one; see .env.example.
#
# TLS is terminated by a reverse proxy on the host, which sends /api/ and
# /auth/ to the backend (port 8080) and everything else to the web app (port
# 3000). Both listen on localhost only, and PostgreSQL is reachable only on
# the internal network.

name: fleetranger

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetranger
      POSTGRES_DB: fleetranger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${FLEETRANGER_DATA_DIR:?}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fleetranger", "-d", "fleetranger"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: fleetranger-backend:${FLEETRANGER_VERSION:?}
    # Loaded onto the server by ship-image.sh; never fetched from a registry.
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fleetranger:${POSTGRES_PASSWORD}@postgres/fleetranger
      RUST_LOG: ${RUST_LOG:-info}
      FLEETRANGER_PUBLIC_URL: ${FLEETRANGER_PUBLIC_URL:?}
      DJI_APP_KEY: ${DJI_APP_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      FLEETRANGER_SESSION_GAP_MINUTES: ${FLEETRANGER_SESSION_GAP_MINUTES:-}
    # The owner of the flight log directory, so uploads and the logs copied
    # there before share one owner (the image's default is uid 65532).
    user: ${FLEETRANGER_UID:-65532}:${FLEETRANGER_GID:-65532}
    volumes:
      # Raw flight logs: uploads are written here, and `import` registers
      # logs copied here before.
      - ${FLEETRANGER_DATA_DIR}/flightlogs:/data/flightlogs
      # The Android app offered on the download page: FleetRanger.apk and its
      # output-metadata.json, from android/release.sh.
      - ${FLEETRANGER_DATA_DIR}/android:/data/android:ro
    ports:
      - 127.0.0.1:8080:8080

  web:
    image: fleetranger-web:${FLEETRANGER_VERSION:?}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Where the server reaches the backend; the browser goes through nginx.
      BACKEND_URL: http://backend:8080
      # The public address, for SvelteKit's check that form posts come from it.
      ORIGIN: ${FLEETRANGER_PUBLIC_URL:?}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
    ports:
      - 127.0.0.1:3000:3000
